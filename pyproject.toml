[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knight-boss-marl"
version = "0.1.0"
description = "A research framework for asymmetric Knight-versus-Boss adaptation."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.24",
    "gymnasium>=1.0",
    "pettingzoo>=1.24",
    "torch>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
